.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.input{width:100%;background:var(--bg2);color:var(--text);border:var(--bw) solid var(--line);border-radius:var(--r);padding:.55rem .7rem;font-family:var(--ffb);font-size:16px;outline:none;transition:border-color .15s}
.input:focus{border-color:color-mix(in srgb,var(--accent) 70%,var(--line))}

.bar>i{display:block;height:100%;transition:width .4s}
.prose-dm p{margin:0 0 1em;line-height:1.75;font-size:1rem}
.player-act{border-left:2px solid var(--accent);padding:.3rem .8rem;margin:1.2rem 0 .9rem;font-family:var(--ffm);font-size:.9rem;color:var(--muted);display:flex;gap:.5rem;justify-content:space-between;align-items:flex-start}

.slide-in{animation:slideIn .25s ease-out}@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}

.drawer.open{grid-template-rows:1fr}.drawer>div{overflow:hidden;min-height:0}
.note{margin-top:.4rem;padding:.7rem .8rem;font-size:.9rem;line-height:1.5;background:var(--bg2);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;color:var(--text)}

.prose-dm p:hover .cap,.cap:focus-visible{opacity:1}.cap:hover{color:var(--accent);border-color:var(--accent)}
@media (hover:none){.cap{opacity:.55}}
.trait-row.on{outline:1px solid var(--accent)}
.only-midnight{display:none}[data-theme=midnight] .only-midnight{display:block}

.aug .head,.aug-badge{color:var(--aug)}
.aug-badge{font-size:.62rem;letter-spacing:.04em;line-height:1.2}
.spin{animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.track{position:relative;overflow:hidden;margin-bottom:.35rem;padding:.3rem 0;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.track .fade{position:absolute;top:0;bottom:0;width:26px;pointer-events:none;z-index:1}
.track .fade-l{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}.track .fade-r{right:0;background:linear-gradient(270deg,var(--bg2),transparent)}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}.no-scrollbar::-webkit-scrollbar{display:none}
input[type=range]{accent-color:var(--accent)}
select.input{padding:.4rem}
.safe-b{padding-bottom:max(.6rem,env(safe-area-inset-bottom))}
.safe-t{padding-top:max(.5rem,env(safe-area-inset-top))}

.tile{display:flex;align-items:center;gap:1rem;width:100%;padding:1rem 1.1rem;min-height:68px;background:color-mix(in srgb,var(--text) 2.5%,transparent);color:var(--text);border:1px solid var(--line);border-radius:6px;font-family:var(--ffb);text-align:left;cursor:pointer;position:relative;transition:background-color .15s,border-color .15s}
.tile:hover{background:color-mix(in srgb,var(--text) 5%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.tile:active{background:color-mix(in srgb,var(--text) 8%,transparent)}
.tile.primary{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 7%,transparent)}

.tile.primary:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent)}
.tile .idx{font-family:var(--ffm);font-size:.7rem;color:var(--muted);letter-spacing:.1em;min-width:1.4rem}
.tile .t{font-size:.82rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.tile .s{font-size:.78rem;color:var(--muted);margin-top:.15rem;letter-spacing:.005em}
.tile .chev{margin-left:auto;font-family:var(--ffm);color:var(--muted);transition:transform .15s,color .15s}

.diag{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:4px;background:var(--bg2);font-family:var(--ffm);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:.45rem;vertical-align:middle}
.dot.on{background:var(--good)}.dot.warn{background:var(--accent)}
.rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);border:0}
</style>

function ptsSummary(uni,sel,stats,extra){let gain=0,cost=0;Object.values(sel.flaws).forEach(e=>gain+=e.lv);
 ['perks','styles','skills','langs'].forEach(g=>Object.values(sel[g]).forEach(e=>cost+=e.lv));
 const statNet=STATS.reduce((a,k)=>a+((stats[k]??STAT_BASE)-STAT_BASE),0);cost+=statNet+(extra||0);return {gain,cost,statNet,left:BASE_PTS+gain-cost}}
const scaleB=(v,lv)=>Math.sign(v)*Math.ceil(Math.abs(v)*lv/2);
function buildTraits(uni,sel){const T=TRAITS[uni],bonus={};let hp=0;
 const take=g=>T[g].filter(x=>sel[g][x.id]).map(x=>({...x,level:sel[g][x.id].lv,choice:sel[g][x.id].choice||null}));
 const flaws=take('flaws'),perks=take('perks'),styles=take('styles'),skills=take('skills'),langs=take('langs');
 const addB=(b,lv)=>Object.entries(b||{}).forEach(([k,v])=>{bonus[k]=(bonus[k]||0)+scaleB(v,lv)});
 flaws.concat(perks).forEach(x=>{const cb=(x.cb&&x.choice&&x.cb[x.choice])||{};addB(x.bonus,x.level);addB(cb.bonus,x.level);hp+=((x.hp||0)+(cb.hp||0))*x.level});
 if(styles.length)bonus.Attack=(bonus.Attack||0)+scaleB(1,Math.max(...styles.map(x=>x.level)));
 skills.forEach(x=>x.checks.forEach(c=>{bonus[c]=(bonus[c]||0)+x.level}));
 Object.keys(bonus).forEach(k=>{bonus[k]=Math.max(-5,Math.min(5,bonus[k]))});
 const slim=a=>a.map(x=>({name:x.name,desc:x.desc,level:x.level,choice:x.choice}));
 return {traits:{flaws:slim(flaws),perks:slim(perks),styles:slim(styles),skills:slim(skills),langs:slim(langs)},bonus,hpMod:hp}}

 return `TRAITS (levels run 1-5; higher = stronger perk/skill or worse flaw). Flaws: ${L(t.flaws,x=>traitLabel(x)+' - '+x.desc)}. Perks: ${L(t.perks,x=>traitLabel(x)+' - '+x.desc)}. Fighting styles: ${L(t.styles,traitLabel)}. Skills: ${L(t.skills,traitLabel)}. Languages (level = fluency, 1 basic phrases to 5 native): ${L(t.langs,traitLabel)}. Actively reference the exact factions, languages and proficiencies above in encounters (e.g. the named bounty-issuer sends hunters; NPCs speaking a known language are understood at the stated fluency; unknown tongues are not). The character speaks only the common tongue plus the languages listed.`}

const splitDur=n=>{n=Math.max(0,Math.floor(n||0));const y=Math.floor(n/360),r=n%360,m=Math.floor(r/30),r2=r%30;return {y,m,w:Math.floor(r2/7),d:r2%7}};
function fmtDur(n){const s=splitDur(n),o=[];[['y','year'],['m','month'],['w','week'],['d','day']].forEach(([k,l])=>{if(s[k])o.push(s[k]+' '+l+(s[k]===1?'':'s'))});return o.length?o.join(', '):'0 days'}

function timeAdvance(text){const t=String(text||'');
 const m=t.match(/\b(?:wait|rest|sleep|camp|spend|pass|travel|work|train|recover|study|craft|build|toil|labou?r|journey|march|sail|ride|meditate|heal)\w*\b[^.!?]{0,40}?\b(\d{1,3}|an?|one|two|three|four|five|six|seven|eight|nine|ten|twelve)\s*(day|week|month|year)s?\b/i);
 if(m){const q=DAYNUM[m[1].toLowerCase()]||parseInt(m[1])||0,mul={day:1,week:7,month:30,year:360}[m[2].toLowerCase()];const n=Math.min(3600,q*mul);if(n>0)return {n,why:q+' '+m[2].toLowerCase()+(q===1?'':'s')}}

 if(/\b(?:jump(?:s|ing)?\s+(?:in)?to\s+(?:hyper)?space|jump to lightspeed|(?:enter|engage|activate)\s+(?:the\s+)?hyper(?:space|drive)|make\s+(?:the|a)\s+(?:hyper)?(?:space\s+)?jump|hyperspace jump)\b/i.test(t))return {n:1,why:'hyperspace jump'};
 return {n:0}}
function advanceDay(c,n,why,quiet,ship){if(!n)return c;const before=dayOf(c),after=Math.max(1,before+n),feed=[...c.feed];let cash=c.currency;
 if(n>0){const up=crewUpkeep(c,ship||c.aboard);if(up.cost>0){const tot=up.cost*n,pay=Math.min(cash||0,tot);cash=(cash||0)-pay;feed.push({id:uid(),type:'system',text:`UPKEEP: ${up.n} companion${up.n===1?'':'s'} aboard, ${fmt(pay)} ${(UNI[c.universe]||{}).cur||'credits'} for ${n} day${n===1?'':'s'} (rations & life support)${up.over?`. Overcrowded: ${up.over} extra berth${up.over===1?' costs':'s cost'} double`:''}${pay<tot?'. Funds short: supplies strained':''}.`})}}
 if(n>0){if(!quiet)feed.push({id:uid(),type:'system',text:`TIME +${n} day${n===1?'':'s'}${why?' ('+why+')':''}. Campaign day ${after}.`});
  (c.timelines||[]).forEach(t=>{const e0=before-t.start_day,e1=after-t.start_day;if(e0<t.total_days&&e1>=t.total_days)feed.push({id:uid(),type:'system',text:`TIMELINE COMPLETE: ${t.name}.`})})}

 init(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination)}if(this.ctx.state==='suspended')this.ctx.resume()},
 vol(v){if(this.master)this.master.gain.value=v},
 stop(){clearTimeout(this.timer);this.nodes.forEach(n=>{try{n.stop?n.stop():n.disconnect()}catch(e){}});this.nodes=[]},
 play(t,v){try{this.init();this.stop();this.vol(v);this[t]()}catch(e){}},
 swsynth(){const c=this.ctx,chords=[[110,164.8,220],[87.3,130.8,174.6],[130.8,196,261.6],[98,146.8,196]];let i=0;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(this.master);this.nodes.push(lp);
  const step=()=>{const t=c.currentTime;chords[i%4].forEach(f=>{[-6,6].forEach(dt=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.07,t+2.5);g.gain.linearRampToValueAtTime(0.0001,t+8);o.connect(g);g.connect(lp);o.start(t);o.stop(t+8.2);this.nodes.push(o)})});i++;this.timer=setTimeout(step,6000)};step()},
 lutes(){const c=this.ctx,sc=[146.8,164.8,174.6,220,246.9,293.7,329.6,392];
  const d=c.createOscillator(),dg=c.createGain();d.type='sine';d.frequency.value=73.4;dg.gain.value=0.05;d.connect(dg);dg.connect(this.master);d.start();this.nodes.push(d);
  const step=()=>{const t=c.currentTime,f=pick(sc);[1,2].forEach((m,k)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f*m;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22/(k+1),t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+1.7)});this.timer=setTimeout(step,Math.random()<.3?260:Math.random()*600+420)};step()},
 wind(){const c=this.ctx,len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=buf;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=0.8;
  const l=c.createOscillator(),lg=c.createGain();l.frequency.value=0.13;lg.gain.value=300;l.connect(lg);lg.connect(f.frequency);
  const g=c.createGain();g.gain.value=0.5;s.connect(f);f.connect(g);g.connect(this.master);s.start();l.start();this.nodes.push(s,l)}
};

const CHECKS=[
 [/bribe|persuad|convinc|charm|negotiat|haggle|barter|plead|flatter|diplomat|reassur/i,'CHA','Persuasion',13],
 [/intimidat|threaten|menace|coerce|growl/i,'CHA','Intimidation',14],
 [/bluff|\blie\b|deceiv|fake|forge|disguise|pretend|impersonat|\bcon\b/i,'CHA','Deception',14],
 [/sneak|hide|creep|stealth|slip past|pickpocket|blend/i,'DEX','Stealth',13],
 [/pick (the )?lock|lockpick|disarm|slice|hack|bypass|jury-rig|repair|sabotage|tinker/i,'INT','Tinkering / Slicing',14],
 [/recall|lore|identify|decipher|translate|analy[sz]e|study|read the/i,'INT','Lore',13],
 [/search|scan|investigat|examin|inspect|track|listen|spot|look for|read the stranger/i,'WIS','Perception',12],
 [/climb|lift|break|smash|force open|shove|grapple|wrestle|pray/i,'STR','Athletics',13],
 [/dodge|leap|jump|flee|run |escape|disengage|flank|take cover/i,'DEX','Acrobatics',12],
 [/cast|blast|force push|force/i,'MAG','Spellcraft / Force',13],
 [/attack|strike|stab|slash|shoot|fire |swing|duel|fight|punch|\bhit\b|kill|throw|hurl|\blob\b|toss/i,'ATK','Attack',13]
];
const HEALRE=/medpac|potion|healing draught|draught|bacta|bandage|stim/i;
function detectCheck(text){
 if(HEALRE.test(text)||/\?\s*$/.test(text))return null;
 for(const [re,stat,label,dc] of CHECKS){if(re.test(text)){
  let d=dc;if(/careful|patient|slowly|cleverly|prepare/i.test(text))d-=1;if(/reckless|hastily|quickly|rush|blindly/i.test(text))d+=2;
  return {stat,label,dc:d}}}
 return null}
function resolveStat(stat,camp){const s=Object.fromEntries(STATS.map(k=>[k,effStat(camp,k)]));
 if(stat==='ATK')return s.STR>=s.DEX?'STR':'DEX';
 if(stat==='MAG')return ['INT','WIS','CHA'].reduce((a,b)=>s[a]>=s[b]?a:b);
 stat=STAT_ALIAS[stat]||stat;return STATS.includes(stat)?stat:'WIS'}
function rollParts(chk,camp,w){const stat=(w&&(chk.label==='Attack'||chk.label==='Gunnery'))?weaponStat(w):resolveStat(chk.stat,camp),bn=(camp.bonus&&camp.bonus[chk.label])||0,gb=gearBonus(chk.label,camp,w);
 return {stat,bn,gb,m:modOf(effStat(camp,stat))+bn+gb}}
function makeRoll(chk,camp,w){
 const p=rollParts(chk,camp,w),r=d20(),total=r+p.m;
 const crit=r===20?'crit':r===1?'fumble':null;
 return {id:uid(),type:'roll',label:chk.label,stat:p.stat,sl:statLabel(camp.universe,p.stat).abbr,mod:p.m,bn:p.bn,gb:p.gb,wname:w?w.name:null,d20:r,total,dc:chk.dc,crit,success:crit==='crit'?true:crit==='fumble'?false:total>=chk.dc}}

 {const pool=loreIn(camp),cast=camp.cast||[];let sp=opening?null:mentionLore(text,pool);if(!sp&&moves&&pool.length&&Math.random()<.4){const fresh=pool.filter(i=>!cast.includes(i.id));if(fresh.length)sp=pick(fresh)}

const dsKeyLS=()=>{try{return localStorage.getItem('deepseek_api_key')||''}catch(e){return ''}};
function dsUrl(u){u=String(u||'').trim();if(!u)return DS_DEFAULT;const m=u.match(/^(https?):\/\/([^\/:?#]+)(:\d+)?([^?#]*)/i);if(!m)return null;
 if(m[1].toLowerCase()==='http'&&!/^(localhost|127\.0\.0\.1)$/i.test(m[2]))return null;
 let p=m[4].replace(/\/{2,}/g,'/').replace(/\/+$/,'');while(/\/chat\/completions$/i.test(p))p=p.replace(/\/chat\/completions$/i,'').replace(/\/+$/,'');
 return m[1].toLowerCase()+'://'+m[2]+(m[3]||'')+p+'/chat/completions'}
const OR_RE=/^https:\/\/([^\/]+\.)?openrouter\.ai\//i;
const dsHeaders=(url,key)=>{const h={'Content-Type':'application/json',Authorization:`Bearer ${key}`};
 if(OR_RE.test(url)){let o='';try{o=location.origin}catch(e){}h['HTTP-Referer']=(o&&o!=='null'&&/^https?:/i.test(o))?o:'https://localhost';h['X-Title']='Solo Text RPG Companion'}return h};
function dsErr(e){const s=e&&e.status,m=String((e&&e.message)||e||'');
 if(s===401)return 'Invalid API key (401). Check the key in Settings.';if(s===402)return 'Insufficient DeepSeek balance (402).';if(s===429)return 'Rate limit reached (429). Wait a moment and try again.';
 if(s>=500)return 'DeepSeek server error ('+s+'). Try again shortly.';if(s)return 'Request failed (HTTP '+s+').';

 if(!r.ok){const t=await r.text().catch(()=>'');const e=new Error('HTTP '+r.status+' '+t.slice(0,160));e.status=r.status;throw e}
 let j;try{j=await r.json()}catch(e){throw new Error('The endpoint returned an unreadable response.')}
 const m=j&&j.choices&&j.choices[0]&&j.choices[0].message;if(!m||typeof m.content!=='string'||!m.content.trim())throw new Error('The model returned an empty reply.');return m.content}

- Reputation & bounties: the app tracks standing from -2 (Hostile) to +2 (Honored) with REP (Republic), EMP (Galactic Empire), HUT (Hutt Cartel), SYN (Syndicate / Black Sun), MAN (Mandalorians) and REB (Rebel Alliance). When the player's deeds clearly change a faction's view of them, emit once in the prose [REP: EMP | DELTA: -1] (DELTA is +1 or -1). When a faction puts a price on the player's head, emit [BOUNTY: 5000 | ISSUER: HUT]. LIVING SHEET "rep" lists current non-zero standing; honor it in NPC attitudes (Hostile patrols attack and shopkeepers refuse service). The app strips these tags, so never mention them or invent other numbers.
- Dogfights: lines beginning [SYSTEM: Dogfight ...] are authoritative engine results of ship-to-ship rolls. Narrate them exactly, never change hits, damage or escapes, and do not add player_damage for them. A LIVING SHEET dogfight entry is the hostile ship.
- Force system (Star Wars): LIVING SHEET "force" lists Discipline (dis), midi-chlorians (mc) and Force Energy. The engine rolls every Force die. A player line ending [SYSTEM: Force Channel | Roll: X | DIS Mod: +Y | Midi-chlorians: Z,000 | Energy: R/M] is a freeform Force action: treat Roll X (d20 plus DIS modifier) and the midi-chlorian tier as authoritative and never reroll or override them. Scale power to the tier (Latent 5-8: flickers and small nudges; Knight/Apprentice 9-13: reliable feats; Master/Lord 14-17: dramatic mastery; Grandmaster/Chosen One 18-20: overwhelming). Roll 15+ lands strongly, 10-14 works with a cost or complication, under 10 narrates struggle, mental strain and resistance and the effect may fail. The story stays freeform, but never invent Energy changes. Lines [SYSTEM: Force Strike ...] are authoritative combat results: narrate them exactly and add no player_damage for them. Characters whose dis is under 5 cannot use the Force unless LIVING SHEET force.awakened is true: when force.sensitive is false, narrate any Force attempt as failing or being impossible.
- scene_npcs: array (max 5) of the named characters physically present right now, each {"name","ac":8-18,"hp":6-40,"hostile":true|false}; [] when nobody is present. Keep names identical from turn to turn; the engine tracks their HP and damage itself.
- Scene menu: a player line ending [SYSTEM: Dialogue Check (Skill) | Roll: X vs DC Y — SUCCESS/FAILURE] is an authoritative engine result of the spoken line: narrate the NPC's reaction to match it and never change it. A line ending [SYSTEM: Force Action | Roll: X | DIS Mod: +Y | Midi-chlorians: Z,000 | Intent: "..."] is a freeform Force use: identify the governing Force skill or technique, set a fair DC from the situation, compare the provided Roll X against it, and begin the narration with one line [FORCE CHECK: Skill Name | DC: N | Roll: X — SUCCESS/FAILURE] before describing the outcome. Never reroll, and never invent Energy changes.
- Force awakening: only when the story truly earns it (touching an ancient Jedi or Sith holocron, deep meditation with a master, kyber crystal resonance, surviving near-death), emit once in the prose [FORCE_AWAKEN: latent | DIS_BOOST: +2] or [FORCE_AWAKEN: trained | DIS: 9]. The engine unlocks the Force menu, raises Discipline and sets the Energy pool; do not emit it for a character whose sheet already shows force.awakened or dis 5+ unless they are truly deepening, and never state Energy numbers yourself.
- Alignment & augments: LIVING SHEET "align" is the player's moral and ethical alignment. Let NPCs read and react to the player's deeds and words in light of it, but it never restricts what the player may do and you never change it. Attribute values above 20 listed under "aug" are gear- or buff-augmented (hard cap 100); the engine already applies their modifiers. When a Force power, stim or gear clearly boosts an attribute for a few turns, emit once in the prose [AUGMENT: MGT | +6 | Force Speed | TURNS: 3] (attributes MGT, AGI, RES, TEC, DIS, PRS or STR, DEX, CON, INT, WIS, CHA); [AUGMENT_END: Force Speed] ends it early. The app strips the tags.
- Companions: LIVING SHEET "crew" lists the recruited companions (archetype, follower / on ship / at camp, role, HP). Lines beginning [CREW: ...] are authoritative engine results of their actions (attacks, turret fire, medpacs, Force Heal, interposing for the player, damage taken): narrate them exactly and never change hits, damage, healing or downed status. Weave each companion's personality, banter, bickering and callouts into the prose every scene (aggressive: eager and blunt, tactical: clipped and watchful, protector: steadfast, support: caring and dry). Companions at camp stay behind. Never list companions in scene_npcs. A player line ending [SYSTEM: Recruitment Check (Persuasion) | Roll: X vs DC Y — SUCCESS/FAILURE] is an authoritative result: on SUCCESS the NPC agrees to join the crew, on FAILURE they decline in character. "overcrowded":true means the ship is over its berthing limit (supplies strained, slower).
- Environment: LIVING SHEET "env" is an engine tag [ENV: Planet · District · Lighting, Hazard, Security] rolled by the app on arrival, district change and rest. Reflect those sensory conditions (light, weather, crowd and patrol mood) in prose, pacing and NPC behaviour, but never invent physical world rules or numbers: the engine already applies hazard modifiers to ranged attacks and shield recharge, and you never change or re-roll the tag.
- Spellcasting (Forgotten Realms): LIVING SHEET "magic" lists the caster's ability (INT or WIS), score, Spell Energy and any ward. The engine rolls every spell die and spends all Spell Energy. A line beginning [SYSTEM: Spell Cast | ...] is authoritative: narrate Magic Missile, Fireball, Shield and Cure Wounds exactly as given (hits, damage, healing, ward values) and never change them. A player line ending [SYSTEM: Spell Cast | Roll: X | INT Mod: +Y | Spell Energy: R/M | Intent: "..."] is a freeform spell: treat Roll X (d20 plus the modifier) against your own sensible DC for what the spell attempts, narrate the result, and for stat damage use player_damage or stat_check_required as usual. Never let a character cast without Spell Energy. Awakening: only when the story truly earns it (a spellbook, a sacred relic, a patron's gift), emit once in the prose [SPELL_AWAKEN: arcane | INT_BOOST: +2] or [SPELL_AWAKEN: divine | WIS_BOOST: +2]; the engine unlocks casting.
- Living galaxy: lines beginning [WORLD STATE: ...] and [AMBUSH: ...] are authoritative engine events (a faction blockade, takeover or lockdown; a bounty hunter intercepting the player). Narrate them exactly, never contradict them, and let a spawned Bounty Hunter attack hostile. Bounties in either universe use [BOUNTY: 3000 | ISSUER: Zhentarim].
- Shields: shield and deflector points never regenerate by themselves. They return only through a rest, a Shield Booster, or a repair kit, all handled by the engine; never restore or invent shield points in prose.
- Engine loot: when a foe falls the app rolls a loot container itself (credits and gear). Lines [SYSTEM: Loot Claimed | ...] are authoritative: never invent drops, prices or stock for defeated foes and never emit [LOOT: ...] for items taken from a body.
- Character points: after a major milestone (an arc or major goal completed) you may emit [AWARD_CP: 1] once in the prose; the engine records it.
- items_awarded: array of {"name","description"}.
- dynamic_actions: 3-5 short, era-specific actions the player could take in the current room or event.
- Loot: whenever the player gains an item or money, embed an inline tag in the prose exactly like [LOOT: Item Name | QUALITY: 0-10 | CREDITS: n] (CREDITS: 0 for plain items; for pure money use [LOOT: Credits | CREDITS: n]). Leave items_awarded empty. The app strips these tags and updates the pack and wallet.`;
 const dictBlock=dict.filter(e=>inScope(e,camp)).map(dictText).join('\n');
 const st=`CHARACTER STATE: ${camp.name}, ${camp.species||'unknown species'} ${camp.arche} from ${camp.homeworld||'parts unknown'}. HP ${camp.hp}/${camp.maxHp}, ${u.sec} ${camp.sec}/${camp.maxSec}. Stats ${STATS.map(s=>statLabel(camp.universe,s).abbr+' '+camp.stats[s]).join(', ')}. Active quests: ${camp.quests.map(q=>q.title).join('; ')}.`;
 // history
 const msgs=[];
 camp.feed.forEach(e=>{
  if(e.type==='player'){msgs.push({role:'user',content:e.text})}
  else if(e.type==='dm'){msgs.push({role:'assistant',content:e.text})}
  else if(e.type==='roll'){const t=`[SYSTEM ROLL RESULT] ${e.label} (${e.sl||e.stat} ${sign(e.mod)}): d20=${e.d20}, total ${e.total} vs DC ${e.dc} => ${e.success?'SUCCESS':'FAILURE'}${e.crit?' (natural '+(e.crit==='crit'?'20':'1')+')':''}. Narrate this outcome.`;
   const last=msgs[msgs.length-1];if(last&&last.role==='user')last.content+='\n'+t;else msgs.push({role:'user',content:t})}
  else if(e.type==='combat'){const last=msgs[msgs.length-1];if(last&&last.role==='user')last.content+='\n'+e.text;else msgs.push({role:'user',content:e.text})}
 });
 // compress older turns, keep last 6 verbatim
 const pi=[];msgs.forEach((m,i)=>{if(m.role==='user'&&!m.content.startsWith('[SYSTEM'))pi.push(i)});
 let summary='';let verb=msgs;
 if(pi.length>6){const cut=pi[pi.length-6];summary=msgs.slice(0,cut).map(m=>(m.role==='user'?'Player: ':'Outcome: ')+m.content.replace(/\s+/g,' ').slice(0,150)).join('\n').slice(-3500);verb=msgs.slice(cut)}
 if(!verb.length||verb[verb.length-1].role!=='user')verb.push({role:'user',content:extra||'Begin the campaign with a vivid opening scene.'});
 return [{role:'system',content:sys},
  ...(dictBlock?[{role:'system',content:'CUSTOM DICTIONARY (canon, use these when relevant):\n'+dictBlock}]:[]),
  {role:'system',content:st},
  ...(sceneContext(camp)?[{role:'system',content:sceneContext(camp)}]:[]),
  ...(summary?[{role:'system',content:'SUMMARY OF EARLIER EVENTS (compressed):\n'+summary}]:[]),
  ...verb]}

function npcBase(it){let h=0;for(const ch of it.id)h=(h*31+ch.charCodeAt(0))%97;const t=(it.role+' '+it.name+' '+it.lore).toLowerCase(),f=it.cat==='faction',cl=v=>Math.max(2,Math.min(20,v));
 return {thr:cl((f?9:7)+(/jedi|sith|lord|emperor|master|commander|general|admiral|warlord|queen|king|archmage|dragon|crime|vader|mandalorian|bounty/.test(t)?5:0)+h%5),
  inf:cl((f?11:6)+(/lord|leader|queen|king|crime|council|senator|empire|republic|guild|chancellor/.test(t)?4:0)+(h>>1)%5),
  res:cl((f?10:5)+(/wealth|merchant|crime|empire|republic|guild|hutt|noble|baron|syndicate/.test(t)?4:0)+(h>>2)%5),f}}

function eraTags(it){const order=it.uni==='star_wars'?ERA_KEYS:FR_ERA_KEYS,nm=k=>ERA_SHORT[k]||ERA_NAME[k]||k;
 if(!it.eras||!it.eras.length)return [];if(it.eras.length>=order.length)return ['All eras'];
 const idx=it.eras.map(k=>order.indexOf(k)).filter(i=>i>=0).sort((a,b)=>a-b);
 if(idx.length>=3&&idx[idx.length-1]-idx[0]===idx.length-1)return [nm(order[idx[0]])+' → '+nm(order[idx[idx.length-1]])];
 return idx.map(i=>nm(order[i]))}

const statLine=i=>i.cat==='weapon'?`FP ${i.fp} · RoF ${i.rof} · WT ${i.wt}`:i.cat==='armor'?`AR ${i.ar} · ER ${i.er} · ENC ${i.enc}`:i.cat==='vehicle'?`ARM ${i.arm} · SHD ${i.shd} · FP ${i.fp} · SPD ${i.spd} · CAP ${i.cap}`+hdTag(i):i.type;
function LoadoutBuilder({uni,eraId,L,setL,credLeft,ptsLeft,conv,cash,onConv}){
 const[slot,setSlot]=useState(null);const[q,setQ]=useState('');const[lim,setLim]=useState(10);const[msg,setMsg]=useState('');
 const unit=UNIT[uni],step=STEP_CR[uni],ab=CR_ABBR[uni];
 const slotPrice=k=>k==='primary'||k==='sidearm'?(L[k]?DBMAP[L[k]].worth:0):k==='apparel'?(L.apparel?customizeApparel(DBMAP[L.apparel.id],L.apparel.q,L.apparel.m).price:0):0;
 const vehPts=L.vehicle?DBMAP[L.vehicle].pts:0;
 const choose=(it)=>{
  if(slot==='primary'||slot==='sidearm')setL(l=>({...l,[slot]:it.id}));
  else if(slot==='apparel')setL(l=>({...l,apparel:{id:it.id,q:2,m:1}}));
  else if(slot==='vehicle')setL(l=>({...l,vehicle:it.id}));
  else setL(l=>({...l,[slot]:[...l[slot],it.id]}));
  if(slot!=='belt'&&slot!=='pack')setSlot(null)};
 const capOf=k=>k==='belt'?3:8;
 const rows=slot?eligible(uni,slot,eraId).filter(i=>!q.trim()||[i.name,i.type,i.skill||'',i.category?catLabel(i.category,i.uni):'',i.manufacturer||'',...i.tags].join(' ').toLowerCase().includes(q.trim().toLowerCase())):[];
 const setQM=(k,v)=>{const it=DBMAP[L.apparel.id],cur=customizeApparel(it,L.apparel.q,L.apparel.m).price,na={...L.apparel,[k]:v},np=customizeApparel(it,na.q,na.m).price;
  if(np-cur>credLeft){setMsg('Not enough '+unit.toLowerCase()+' for that upgrade (use the converter above).');return}setMsg('');setL(l=>({...l,apparel:na}))};
 const label=k=>k==='vehicle'&&uni!=='star_wars'?'Assigned Mount / Vehicle':SLOT_DEFS.find(x=>x[0]===k)[1];
 return <div>
  <div className="card p-2 mb-3"><div className="flex items-center gap-2 justify-between flex-wrap">
   <button type="button" className="btn" style={{minHeight:40}} disabled={credLeft<step} onClick={()=>onConv(-1)}>−{fmt(step)} {ab} (+1 Pt)</button>
   <div className="text-center"><div className="mono text-xs muted">{unit}</div><div className="head text-2xl">{fmt(credLeft)}</div></div>
   <button type="button" className="btn" style={{minHeight:40}} disabled={ptsLeft<1} onClick={()=>onConv(1)}>+{fmt(step)} {ab} (−1 Pt)</button></div>
   <div className="text-xs muted mt-1">Starting baseline {fmt(cash)} {unit}. Points converted to {unit.toLowerCase()}: {conv>=0?'+':''}{conv}. Unspent {unit.toLowerCase()} can be converted back (minimum balance 0).</div></div>
  {SLOT_DEFS.map(([k])=>{const multi=k==='belt'||k==='pack';const id=multi?null:k==='apparel'?(L.apparel&&L.apparel.id):L[k];const it=id?DBMAP[id]:null;
   return <div key={k} className="card2 p-2 mb-2">
    <div className="flex justify-between items-center gap-2"><div className="min-w-0"><div className="text-xs mono muted uppercase">{label(k)}</div>
     {!multi&&<div className="head text-lg">{it?it.name:<span className="muted">— empty —</span>}{it&&<span className="mono text-xs muted"> {statLine(it)}{k==='vehicle'?` · ${it.pts} pt${it.pts>1?'s':''}`:` · ${fmt(k==='apparel'?slotPrice('apparel'):it.worth)} ${ab}`}</span>}</div>}
     {multi&&<div className="flex flex-wrap gap-1 mt-1">{L[k].length===0&&<span className="muted text-sm">— empty ({L[k].length}/{capOf(k)}) —</span>}{L[k].map((x,n)=><span key={n} className="badge">{DBMAP[x].name} <button type="button" className="underline" aria-label={'Remove '+DBMAP[x].name} onClick={()=>setL(l=>({...l,[k]:l[k].filter((_,j)=>j!==n)}))}>✕</button></span>)}</div>}</div>
     <div className="flex gap-1 shrink-0"><button type="button" className="btn" style={{minHeight:36}} disabled={multi&&L[k].length>=capOf(k)} onClick={()=>{setSlot(slot===k?null:k);setQ('');setLim(10)}}>{multi?'Add':it?'Change':'Choose'}</button>
      {!multi&&it&&<button type="button" className="btn" style={{minHeight:36}} aria-label="Clear slot" onClick={()=>{setL(l=>({...l,[k]:null}));setMsg('')}}>✕</button>}</div></div>
    {multi&&<div className="text-xs muted mt-1">{L[k].length}/{capOf(k)} slots used</div>}
    {k==='apparel'&&L.apparel&&<div className="note mt-2"><ApparelInspector it={DBMAP[L.apparel.id]} q={L.apparel.q} m={L.apparel.m} setQ={v=>setQM('q',v)} setM={v=>setQM('m',v)} msg={msg}/></div>}
    {slot===k&&<div className="mt-2 card p-2">
     <div className="flex justify-between items-center mb-1"><b className="head">Choose: {label(k)}</b><button type="button" className="btn" style={{minHeight:30}} onClick={()=>setSlot(null)}>Close</button></div>
     <input className="input mb-2" type="search" placeholder="Search…" value={q} onChange={e=>{setQ(e.target.value);setLim(10)}}/>
     {rows.slice(0,lim).map(i=>{const replaced=k==='vehicle'?0:slotPrice(k);const poor=k==='vehicle'?(i.pts-vehPts>ptsLeft):(i.worth-replaced>credLeft);
      return <div key={i.id} className="card2 p-2 mb-1"><div className="flex justify-between gap-2 items-start"><div className="min-w-0"><div className="head">{i.name}</div><div className="mono text-xs muted">{statLine(i)}</div><div className="flex flex-wrap gap-1 mt-1">{i.tags.map(g=><span key={g} className="badge">[{g}]</span>)}</div></div>
       <div className="text-right shrink-0"><div className="text-xs mb-1"><b>{k==='vehicle'?`${i.pts} pt${i.pts>1?'s':''}`:`${fmt(i.worth)} ${ab}`}</b></div><button type="button" className="btn btn-p" style={{minHeight:34}} disabled={poor} onClick={()=>choose(i)}>{multi?'Add':'Choose'}</button></div></div>
       <div className="text-xs mt-1">{i.lore}</div>{poor&&<div className="text-xs accent mt-1">{k==='vehicle'?'Not enough character points.':'Not enough '+unit.toLowerCase()+'.'}</div>}</div>})}
     {rows.length>lim&&<button type="button" className="btn w-full" onClick={()=>setLim(lim+10)}>Show more ({rows.length-lim})</button>}
     {!rows.length&&<div className="muted text-sm">Nothing matches.</div>}</div>}
   </div>})}
  <div className="text-xs muted">Vehicles are assigned with character points (see each cost). An equipped weapon's FP sets damage and, with RoF, adds to hit; apparel absorbs incoming damage by AR/ER and bulky sets penalize Stealth and Acrobatics. Items you buy stay on you: the DM only ever sees your equipped gear, belt, pack and wallet.</div></div>}

function Settings({S,setS,audioSet,dict,setDict,saves,setSaves,activeCamp,onClose,onExitCampaign,stock,saveStock}){
 const[exp,setExp]=useState('');const[expId,setExpId]=useState(activeCamp?activeCamp.id:(saves[0]?.id||''));
 const[imp,setImp]=useState('');const[msg,setMsg]=useState('');const[show,setShow]=useState(false);const[conf,setConf]=useState('');const[ping,setPing]=useState('');const[keyDraft,setKeyDraft]=useState(S.apiKey||'');const[keyMsg,setKeyMsg]=useState('');const[epDraft,setEpDraft]=useState(S.endpoint||'');const[epMsg,setEpMsg]=useState('');
 const doExport=()=>{const c=saves.find(s=>s.id===expId);if(!c){setMsg('Nothing to export.');return}
  const txt=JSON.stringify({app:'solo-text-rpg',version:1,campaign:c,dictionary:dict.filter(d=>d.scope.includes('all')||d.scope.includes(c.id))},null,1);setExp(txt);
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=(c.name||'campaign')+'.json';a.click()}catch(e){}
  setMsg('Exported below. If your browser blocked the download, use Copy.')};
 const doImport=txt=>{try{const j=JSON.parse(txt);const c=j.campaign||j;if(!c.universe||!c.feed)throw new Error('Not a campaign file');
  const id=uid();setSaves([{...c,id},...saves]);if(Array.isArray(j.dictionary))setDict([...dict,...j.dictionary.map(d=>({...d,id:uid(),scope:d.scope.includes('all')?['all']:[id]}))]);setMsg('Imported "'+c.name+'".');setImp('')}catch(e){setMsg('Import failed: '+e.message)}};
 const sure=(k,fn)=>()=>{if(conf===k){fn();setConf('')}else setConf(k)};
 const test=async()=>{setPing('Pinging…');try{const t=await deepseek(S.apiKey,S.model,[{role:'user',content:'Reply with the single word: pong'}],8);setPing('Connected: '+t.slice(0,40))}catch(e){setPing('Failed: '+dsErr(e))}};
 const saveKey=()=>{const k=keyDraft.trim();if(!k){setKeyMsg('Enter a key first.');return}setKeyDraft(k);setS({...S,apiKey:k});try{localStorage.setItem('deepseek_api_key',k)}catch(e){}setKeyMsg('Key saved in this browser.')};
 const clearKey=()=>{setKeyDraft('');setS({...S,apiKey:''});try{localStorage.removeItem('deepseek_api_key')}catch(e){}setKeyMsg('Key removed.');setPing('')};
 const saveEp=()=>{const v=epDraft.trim();if(v&&!dsUrl(v)){setEpMsg('Use a full https:// URL (http:// only for localhost).');return}setS({...S,endpoint:v});setEpMsg(v?'Endpoint saved.':'Using the default DeepSeek endpoint.')};
 return <Modal wide title="Settings & Storage" onClose={onClose}>
  <Acc title="Appearance & Themes">
   <div className="grid gap-2 sm:grid-cols-3 mb-3">{[['midnight','Obsidian / Ice'],['springfield','Springfield at Night'],['cream','Paper Light / Minimal Cream']].map(([k,l])=><button key={k} className={'btn '+(S.theme===k?'btn-p':'')} onClick={()=>setS({...S,theme:k})}>{l}</button>)}</div>
   <AudioBar audio={S.audio} onChange={audioSet}/></Acc>
  <Acc title="Gameplay Options">
   <div className="mb-3"><div className="head text-lg mb-1">Turn Editing</div><Toggle on={S.turnEditing} onChange={v=>setS({...S,turnEditing:v})} a="On" b="Off"/><div className="muted text-sm mt-1">When on, an edit control appears on your past actions. Editing one drops every later turn and re-branches the story.</div></div>
   <div className="mb-3"><div className="head text-lg mb-1">Combat Dice Automation</div><Toggle on={!S.manualDice} onChange={v=>setS({...S,manualDice:!v})} a="Instant Auto-Roll" b="Manual Dice Tray"/></div>
   <div className="mb-3" data-lg-setting><div className="head text-lg mb-1">Living Galaxy / Dynamic Faction War</div><Toggle on={!!S.livingGalaxy} onChange={v=>setS({...S,livingGalaxy:v})} a="ON" b="OFF"/><div className="muted text-sm mt-1">When on, days that pass (rest or travel) carry a small chance of a faction blockade, takeover or lockdown on contested worlds, and a hostile reputation or large bounty can bring bounty hunters down on you during jumps, long journeys and cantina visits. Off by default.</div></div>
   <div className="mb-3" data-rumor-setting><div className="head text-lg mb-1">Tavern Rumors &amp; Local Leads</div><Toggle on={S.rumors!==false} onChange={v=>setS({...S,rumors:v})} a="ON" b="OFF"/><div className="muted text-sm mt-1">When on, cantinas and taverns offer a Listen for Rumors action and may hand you a local lead on arrival. Off ignores rumors entirely.</div></div>
   <div className="mb-3" data-tone-setting><div className="head text-lg mb-1">Narrative Tone</div>
    {activeCamp?<ToneGrid value={toneOf(activeCamp).id} onChange={id=>setSaves(sv=>sv.map(s=>s.id===activeCamp.id?{...s,tone:id}:s))}/>:<div className="muted text-sm">Open a campaign to change its tone. New campaigns pick a tone in the Bio section of character creation.</div>}
    <div className="muted text-sm mt-1">Applies at once to the next narrator reply. No restart needed.</div></div>
   <div className="mb-3" data-rest-setting><div className="head text-lg mb-1">Camp &amp; Rest Encounters</div>
    {(()=>{const rc=restCfg(S);return <div className="grid gap-2">{[['peace','Peaceful Rest Weight'],['banter','Companion Banter / Scene Weight'],['ambush','Night Ambush / Patrol Weight']].map(([k,l])=><label key={k} className="block"><span className="flex justify-between text-sm"><span>{l}</span><span className="mono" data-rest-val={k}>{rc[k]}%</span></span><input type="range" min="0" max="100" step="1" value={rc[k]} data-rest={k} aria-label={l} className="w-full" onChange={e=>setS({...S,rest:normRest(rc,k,e.target.value)})}/></label>)}
     <div className="flex items-center gap-2"><span className="mono text-xs muted" data-rest-total>Total {rc.peace+rc.banter+rc.ambush}%</span><button type="button" className="btn" data-rest-reset style={{minHeight:30,fontSize:'.72rem'}} onClick={()=>setS({...S,rest:{...REST_DEF}})}>[ Reset to 80 / 10 / 10 ]</button></div></div>})()}
    <div className="muted text-sm mt-1">Rolled each time you make camp. The three weights always total 100%; moving one rescales the other two. Companion scenes need a living follower or camp companion.</div></div>
   <Acc sub title="Custom Dictionary"><DictManager dict={dict} setDict={setDict} saves={saves} lockUni={activeCamp?activeCamp.universe:null}/></Acc></Acc>
  <Acc title="Stock Characters">
   <div className="muted text-sm mb-2">One reusable default character per universe. It appears as a Load Stock Character button in the new-campaign wizard.</div>
   {UNIVERSES.filter(x=>x.active).map(x=><Acc sub key={x.id} title={x.name+(stock[x.id]?' · '+stock[x.id].name:'')}><StockEditor uni={x.id} stock={stock[x.id]} onSave={saveStock}/></Acc>)}</Acc>
  <LoreBibleSection defaultUni={activeCamp?activeCamp.universe:'all'} camp={activeCamp}/>
  <Acc title="AI Narrator &amp; API Settings">
   <div data-ai-settings>
   <div className="flex items-center gap-2 mb-2"><span className={'dot '+((S.apiKey||keyDraft)?(S.apiKey?'on':'warn'):'warn')}/><span className="mono text-xs" data-key-status>{S.apiKey?'Key saved - AI narration enabled':'No key saved - demo narrator active'}</span></div>
   <label className="block mb-2"><span className="text-sm muted">DeepSeek API key (stored only in this browser, sent only to the endpoint below)</span>
    <div className="flex gap-2"><input className="input" data-key-input type={show?'text':'password'} autoComplete="off" spellCheck="false" placeholder="sk-..." value={keyDraft} onChange={e=>{setKeyDraft(e.target.value);setKeyMsg('')}}/><button type="button" className="btn shrink-0" data-key-toggle aria-pressed={show} onClick={()=>setShow(!show)}>{show?'Hide':'Show'}</button></div></label>
   <div className="flex flex-wrap gap-2 mb-1"><button type="button" className="btn btn-p" data-key-save disabled={!keyDraft.trim()} onClick={saveKey}>[ Save Key ]</button><button type="button" className="btn" data-key-clear disabled={!S.apiKey&&!keyDraft} onClick={clearKey}>[ Clear Key ]</button><button type="button" className="btn" data-key-test disabled={!S.apiKey} onClick={test}>[ Test Connection ]</button></div>
   {keyMsg&&<div className="text-sm mono mb-1" role="status" data-key-msg>{keyMsg}</div>}{ping&&<div className="text-sm mono mb-1" data-ping>{ping}</div>}
   <label className="block mb-2 mt-2"><span className="text-sm muted">Model ID (type any ID, or pick a suggestion)</span><input className="input" data-model list="ai-model-list" type="text" autoComplete="off" spellCheck="false" placeholder="deepseek-chat" value={S.model||''} onChange={e=>setS({...S,model:e.target.value.trim()})}/>
    <datalist id="ai-model-list">{['deepseek-chat','deepseek-reasoner','deepseek/deepseek-chat','deepseek/deepseek-r1','google/gemini-2.0-flash-001'].map(m=><option key={m} value={m}/>)}</datalist></label>
   <div className="flex flex-wrap gap-2 mb-2"><button type="button" className="btn" data-preset-openrouter onClick={()=>{setEpDraft(OR_BASE);setEpMsg('OpenRouter preset applied. Use your OpenRouter key.');setS({...S,endpoint:OR_BASE,model:'deepseek/deepseek-chat'})}}>[ OpenRouter Preset ]</button><button type="button" className="btn" data-preset-deepseek onClick={()=>{setEpDraft('');setEpMsg('DeepSeek preset applied. Use your DeepSeek key.');setS({...S,endpoint:'',model:'deepseek-chat'})}}>[ DeepSeek Preset ]</button></div>
   <label className="block mb-2"><span className="text-sm muted">Custom endpoint URL (optional)</span>
    <input className="input" data-endpoint type="url" autoComplete="off" spellCheck="false" placeholder={DS_DEFAULT} value={epDraft} onChange={e=>{setEpDraft(e.target.value);setEpMsg('')}}/></label>
   <div className="flex flex-wrap gap-2 mb-1"><button type="button" className="btn" data-endpoint-save onClick={saveEp}>[ Save Endpoint ]</button><button type="button" className="btn" data-endpoint-reset onClick={()=>{setEpDraft('');setS({...S,endpoint:''});setEpMsg('Using the default DeepSeek endpoint.')}}>[ Use Default ]</button></div>
   {epMsg&&<div className="text-sm mono" role="status" data-endpoint-msg>{epMsg}</div>}
   <div className="muted text-sm mt-2">A base URL such as https://openrouter.ai/api/v1 gets /chat/completions appended (trailing slashes and a duplicate /chat/completions are trimmed). OpenRouter endpoints also receive the HTTP-Referer and X-Title headers. Each turn sends the compact living sheet (gear, environment, tone directive), recent history and your action. If a request fails, the narrative feed shows a short note and the demo narrator covers that turn. No key? The built-in demo narrator keeps the game fully playable.</div></div></Acc>
  <Acc title="Campaign & Data Management">
   <div className="mb-3"><div className="head text-lg mb-1">Export</div>
    <div className="flex gap-2"><select className="input" value={expId} onChange={e=>setExpId(e.target.value)}>{saves.map(s=><option key={s.id} value={s.id}>{s.name} · {getEra(s).name}</option>)}</select><button className="btn" onClick={doExport}>Export JSON</button></div>
    {exp&&<><textarea className="input mt-2 mono" rows={5} readOnly value={exp} onFocus={e=>e.target.select()}/><button className="btn mt-1" onClick={()=>{try{navigator.clipboard.writeText(exp);setMsg('Copied.')}catch(e){setMsg('Select the text and copy manually.')}}}>Copy</button></>}</div>
   <div className="mb-3"><div className="head text-lg mb-1">Import</div>
    <input type="file" accept="application/json,.json" className="text-sm mb-2" onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f)}}}/>
    <textarea className="input mono" rows={3} placeholder="…or paste campaign JSON here" value={imp} onChange={e=>setImp(e.target.value)}/><button className="btn mt-1" disabled={!imp.trim()} onClick={()=>doImport(imp)}>Import pasted JSON</button></div>
   {msg&&<div className="text-sm mb-2 accent">{msg}</div>}
   <div className="flex gap-2 flex-wrap">
    {activeCamp&&<button className="btn" onClick={sure('one',()=>{setSaves(saves.filter(s=>s.id!==activeCamp.id));onClose();onExitCampaign()})}>{conf==='one'?'Tap again: delete this campaign':'Clear this campaign'}</button>}
    <button className="btn" onClick={sure('all',()=>{setSaves([]);onClose();onExitCampaign()})}>{conf==='all'?'Tap again: delete ALL campaigns':'Clear all campaigns'}</button>
    <button className="btn" onClick={sure('fac',()=>{try{['trpg_saves','trpg_dict','trpg_settings'].forEach(k=>localStorage.removeItem(k))}catch(e){}saveStock('star_wars',null);saveStock('forgotten_realms',null);setSaves([]);setDict([]);setS({...S,apiKey:''});onClose();onExitCampaign()})}>{conf==='fac'?'Tap again: FACTORY RESET':'Factory reset storage'}</button></div></Acc>
 </Modal>}

function NumF({label,v,set}){return <label className="block"><span className="label">{label}</span><input className="input mono" type="number" min="0" max="999" inputMode="numeric" value={v} onChange={e=>set(e.target.value)} style={{padding:'.4rem .5rem'}}/></label>}
const tinyBtn={minHeight:30,fontSize:'.68rem',letterSpacing:'.12em',textTransform:'uppercase',padding:'.2rem .6rem'};
function GoalCard({g,camp,tls,upd}){
 const[flip,setFlip]=useState(false),[ed,setEd]=useState(false),[cd,setCd]=useState(false);
 const[f,setF]=useState({title:g.title,summary:g.summary||'',status:g.status,timelineId:g.timelineId||''});
 const tl=tls.find(t=>t.id===g.timelineId);
 const patch=p=>upd(c=>{const award=p.status==='completed'&&!g.cpAwarded&&g.status!=='completed';return {...c,...(award?{cp:(c.cp||0)+1}:{}),goals:(c.goals||[]).map(x=>x.id===g.id?{...x,...p,...(award?{cpAwarded:true}:{})}:x)}});
 const stCol=g.status==='completed'?'var(--good)':g.status==='abandoned'?'var(--muted)':'var(--accent)';
 const save=()=>{const t=f.title.trim();if(!t)return;patch({title:t,summary:f.summary.trim(),status:f.status,timelineId:f.timelineId||null,edited:true,needs_refine:false});setEd(false)};
 if(ed)return <div className="card2 mb-2 p-3">
  <label className="block mb-2"><span className="label">Title</span><input className="input" value={f.title} onChange={e=>setF({...f,title:e.target.value})}/></label>
  <label className="block mb-2"><span className="label">Description</span><textarea className="input" rows={3} value={f.summary} onChange={e=>setF({...f,summary:e.target.value})} style={{resize:'vertical'}}/></label>
  <div className="grid grid-cols-2 gap-2 mb-3">
   <label className="block"><span className="label">Status</span><select className="input" value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{GOAL_ST.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></label>
   <label className="block"><span className="label">Timeline</span><select className="input" value={f.timelineId} onChange={e=>setF({...f,timelineId:e.target.value})}><option value="">None</option>{tls.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></label></div>
  <div className="flex gap-2"><button className="btn btn-p" style={tinyBtn} disabled={!f.title.trim()} onClick={save}>Save</button><button className="btn" style={tinyBtn} onClick={()=>{setF({title:g.title,summary:g.summary||'',status:g.status,timelineId:g.timelineId||''});setEd(false)}}>Cancel</button></div></div>;
 return <div className="card2 mb-2 p-3" style={{opacity:g.status==='in_progress'?1:.8}}>
  <div className="flex items-start justify-between gap-2"><div className="head text-lg min-w-0" style={{wordBreak:'break-word',textDecoration:g.status==='abandoned'?'line-through':'none'}}>{g.title}</div><span className="badge shrink-0" style={{color:stCol,borderColor:stCol}}>{stLabel(g.status)}</span></div>

function TimelineCard({t,camp,upd}){

 const sp=splitDur(t.total_days);const mk=()=>({name:t.name,y:String(sp.y),m:String(sp.m),w:String(sp.w),d:String(sp.d)});const[f,setF]=useState(mk());
 const total=x=>(+x.y||0)*360+(+x.m||0)*30+(+x.w||0)*7+(+x.d||0);

  <div className="flex gap-2 flex-wrap mt-2"><button className="btn" style={tinyBtn} onClick={()=>setEd(true)}>Edit</button>
   {cd?<button className="btn" style={{...tinyBtn,color:'var(--bad)',borderColor:'var(--bad)'}} onClick={()=>upd(c=>({...c,timelines:(c.timelines||[]).filter(x=>x.id!==t.id),goals:(c.goals||[]).map(g=>g.timelineId===t.id?{...g,timelineId:null}:g)}))} onBlur={()=>setCd(false)} autoFocus>Confirm delete</button>
    :<button className="btn" style={tinyBtn} onClick={()=>setCd(true)}>Delete</button>}</div></div>}
function GoalsPanel({camp,upd,toast}){
 const goals=camp.goals||[],tls=camp.timelines||[];const day=dayOf(camp);
 const[gt,setGt]=useState('');const[addT,setAddT]=useState(false);const[nf,setNf]=useState({name:'',y:'0',m:'0',w:'0',d:'0'});
 const order={in_progress:0,completed:1,abandoned:2};
 const sorted=[...goals].sort((a,b)=>(order[a.status]-order[b.status])||(b.created-a.created));
 const active=goals.filter(g=>g.status==='in_progress').length;
 const ntotal=(+nf.y||0)*360+(+nf.m||0)*30+(+nf.w||0)*7+(+nf.d||0);

 const addGoal=()=>{const t=gt.trim();if(!t)return;upd(c=>({...c,goals:[mkGoal(t,'panel',c),...(c.goals||[])]}));setGt('');toast('Goal added. Refinement queued for next turn.')};
 const addTl=()=>{const n=nf.name.trim();if(!n||ntotal<1)return;upd(c=>({...c,timelines:[...(c.timelines||[]),{id:uid(),name:n,total_days:Math.min(3600,ntotal),start_day:dayOf(c),created:Date.now()}]}));setNf({name:'',y:'0',m:'0',w:'0',d:'0'});setAddT(false)};

   {sorted.length?sorted.map(g=><GoalCard key={g.id} g={g} camp={camp} tls={tls} upd={upd}/>):<div className="muted text-sm">No goals yet. Use the flag button beside the chat input, or the + Goal control on any narrative passage.</div>}</Acc>

    <div className="flex gap-1">{[[-1,'−1 d'],[1,'+1 d'],[7,'+1 wk'],[30,'+1 mo']].map(([n,l])=><button key={l} className="btn" style={{...tinyBtn,minHeight:30,padding:'.2rem .5rem'}} disabled={n<0&&day<=1} onClick={()=>step(n)}>{l}</button>)}</div></div>
    <div className="label mt-1" style={{textTransform:'none',letterSpacing:'.04em'}}>Rest, sleep, camping, hyperspace jumps and stated durations advance the day automatically. 30-day months, 360-day years.</div></div>
   {tls.map(t=><TimelineCard key={t.id} t={t} camp={camp} upd={upd}/>)}

   {addT?<div className="card2 p-3">
    <label className="block mb-2"><span className="label">Project / event name</span><input className="input" placeholder="Factory Construction" value={nf.name} onChange={e=>setNf({...nf,name:e.target.value})}/></label>
    <div className="grid grid-cols-4 gap-2 mb-1"><NumF label="Years" v={nf.y} set={v=>setNf({...nf,y:v})}/><NumF label="Months" v={nf.m} set={v=>setNf({...nf,m:v})}/><NumF label="Weeks" v={nf.w} set={v=>setNf({...nf,w:v})}/><NumF label="Days" v={nf.d} set={v=>setNf({...nf,d:v})}/></div>

   :<button className="btn w-full" style={tinyBtn} onClick={()=>setAddT(true)}><Ico n="plus" s={14}/> New timeline</button>}</Acc></Acc>}

 else body=<div className="app scroll overflow-y-auto"><div className="max-w-xl mx-auto px-5 safe-t flex flex-col" style={{minHeight:'100%'}}>
   <header className="pt-12 pb-8"><div className="label mb-4">Star Wars &nbsp;/&nbsp; Forgotten Realms</div>
    <h1 className="head" style={{fontSize:'1.75rem',lineHeight:1.15,letterSpacing:'.02em',fontWeight:600}}>Solo Text RPG Companion</h1>
    <p className="muted text-sm mt-2">Offline campaign console. Deterministic dice, inventory and merchant systems.</p></header>
   <hr className="rule mb-6"/>
   <nav className="grid gap-3" aria-label="Main menu">
    <button className={'tile'+(saves.length?' primary':'')} onClick={()=>setView('load')}><span className="idx">01</span><span><span className="t block">Resume Campaign</span><span className="s block">{saves.length?saves.length+(saves.length===1?' saved campaign':' saved campaigns'):'No saved campaigns'}</span></span><span className="chev" aria-hidden="true">&rsaquo;</span></button>
    <button className={'tile'+(saves.length?'':' primary')} onClick={()=>setView('wizard')}><span className="idx">02</span><span><span className="t block">New Campaign</span><span className="s block">Choose universe, era and character</span></span><span className="chev" aria-hidden="true">&rsaquo;</span></button>
    <button className="tile" onClick={()=>setShowSet(true)}><span className="idx">03</span><span><span className="t block">Settings &amp; Storage</span><span className="s block">Narrator engine, display, audio, local data</span></span><span className="chev" aria-hidden="true">&rsaquo;</span></button></nav>
   <div className="flex-1"/>
   <footer className="pt-10 pb-6 safe-b"><div className="diag" role="status"><span><span className={'dot '+(S.apiKey?'on':'warn')}/>Narrator</span><b>{S.apiKey?'DeepSeek':'Demo mode'}</b>{S.apiKey&&<span>Model <b>{S.model}</b></span>}{!S.apiKey&&<span style={{marginLeft:'auto'}}>No API key</span>}</div>
    {!S.apiKey&&<p className="muted text-xs mt-2 px-1">Demo narrator active. Add a DeepSeek key under Settings &amp; Storage to enable the full engine.</p>}</footer></div></div>;
 return <div data-theme={S.theme} style={{height:'100%'}}>{body}
  {showSet&&<Settings S={S} setS={setS} audioSet={audioSet} dict={dict} setDict={setDict} saves={saves} setSaves={setSaves} activeCamp={view==='game'?camp:null} onClose={()=>setShowSet(false)} onExitCampaign={exit} stock={stock} saveStock={saveStock}/>}</div>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
